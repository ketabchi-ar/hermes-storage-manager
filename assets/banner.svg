<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" fill="url(#bgBanner)" />

  <!-- Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="140" x2="1280" y2="140" />
    <line x1="0" y1="210" x2="1280" y2="210" />
    <line x1="0" y1="280" x2="1280" y2="280" />
    <line x1="0" y1="350" x2="1280" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />
  </g>

  <!-- Central Glow Ambient Circle -->
  <circle cx="640" cy="210" r="180" fill="#38bdf8" fill-opacity="0.06" filter="blur(60px)" />

  <!-- Logo Icon -->
  <g transform="translate(640, 100)" filter="url(#shadow)">
    <rect x="-42" y="-42" width="84" height="84" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M-6 -22 L16 -22 L-10 6 L12 6 L-16 28 L-4 -4 L-20 -4 Z" fill="#38bdf8" />
  </g>

  <!-- Title -->
  <text x="640" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Hermes Storage Optimizer
  </text>
  <text x="640" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Lightweight, Zero-Dependency Storage &amp; Session Manager for Hermes Agent
  </text>

  <!-- Badges / Highlights -->
  <g transform="translate(640, 310)">
    <!-- Badge 1 -->
    <rect x="-330" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="-235" y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚡ Zero Dependencies</text>

    <!-- Badge 2 -->
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">🖥️ Web Wizard + CLI</text>

    <!-- Badge 3 -->
    <rect x="140" y="-18" width="190" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="235" y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">📦 1-Click ZIP Export</text>
  </g>

  <!-- Bottom Line Accent -->
  <rect x="0" y="416" width="1280" height="4" fill="url(#glow)" />
</svg>
